<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>WanWan-chan — Accessibility</title>
    <style>
      :root {
        --coat: #1a1a1f;
        --coat-hi: #2b2b36;
        --ink: #e6e6ec;
        --ink-dim: #9a9aa8;
        --accent: #d98b94;
        --accent-press: #c4757f;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font: 13px/1.55 -apple-system, 'SF Pro Text', sans-serif;
        color: var(--ink);
        background: var(--coat);
        -webkit-font-smoothing: antialiased;
        padding: 24px 28px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
        cursor: default;
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      p.lede {
        color: var(--ink-dim);
        margin-top: 4px;
      }
      ol {
        list-style: none;
        counter-reset: step;
        margin: 20px 0 4px;
        display: grid;
        gap: 12px;
      }
      ol li {
        counter-increment: step;
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        align-items: start;
      }
      ol li::before {
        content: counter(step);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--coat-hi);
        color: var(--ink);
        font-size: 11px;
        font-weight: 600;
        display: grid;
        place-items: center;
        margin-top: 1px;
      }
      ol code {
        font: 11px/1.4 ui-monospace, 'SF Mono', monospace;
        background: var(--coat-hi);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .row {
        margin-top: auto;
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 1px solid var(--coat-hi);
        background: transparent;
        color: var(--ink);
        border-radius: 7px;
        padding: 8px 14px;
        cursor: pointer;
        transition: background 150ms cubic-bezier(0.2, 0.6, 0.2, 1);
      }
      button:hover {
        background: var(--coat-hi);
      }
      button:active {
        transform: translateY(0.5px);
      }
      button.primary {
        flex: 1;
        background: var(--accent);
        border-color: var(--accent);
        color: #1a1a1f;
      }
      button.primary:hover {
        background: var(--accent-press);
        border-color: var(--accent-press);
      }
      .status {
        margin-top: 10px;
        min-height: 1.55em;
        font-size: 12px;
        color: var(--accent);
        text-align: center;
        opacity: 0;
        transition: opacity 180ms cubic-bezier(0.2, 0.6, 0.2, 1);
      }
      .status.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Let WanWan-chan watch you type</h1>
    <p class="lede">Eye tracking and sleep need one macOS permission.</p>

    <ol>
      <li><span>Open <strong>System Settings</strong> → <strong>Privacy &amp; Security</strong> → <strong>Accessibility</strong>.</span></li>
      <li><span>Enable <code>WanWan-chan</code> in the list. You may need to unlock with Touch&nbsp;ID first.</span></li>
      <li><span>Come back and press <strong>I’ve Granted Access</strong>.</span></li>
    </ol>

    <div class="row">
      <button id="open">Open System Settings</button>
      <button id="recheck" class="primary">I’ve Granted Access</button>
    </div>
    <p id="status" class="status"></p>

    <script type="module">
      const status = document.getElementById('status')
      document.getElementById('open').addEventListener('click', () => {
        window.wanwan?.openAccessibilityPrefs()
      })
      document.getElementById('recheck').addEventListener('click', async () => {
        // The main process closes this window itself on success, so this
        // branch is only reached when the grant is still missing.
        const trusted = await window.wanwan?.recheckAccessibility()
        if (!trusted) {
          status.textContent = 'Not yet — make sure WanWan-chan is toggled on, then try again.'
          status.classList.add('show')
        }
      })
    </script>
  </body>
</html>
